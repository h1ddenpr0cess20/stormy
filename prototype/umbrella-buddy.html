<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Umbrella — AI assistant avatar</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  #state {
    position: fixed; left: 24px; bottom: 22px; z-index: 5;
    display: flex; gap: 8px; font: 600 11px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: .14em; text-transform: uppercase;
  }
  #state button {
    appearance: none; cursor: pointer; padding: 9px 14px; border-radius: 4px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14);
    color: rgba(255,255,255,.55); font: inherit; transition: color .18s, background .18s, border-color .18s;
  }
  #state button:hover { color: rgba(255,255,255,.9); background: rgba(255,255,255,.1); }
  #state button[aria-pressed="true"] { color: #0d0f12; background: #dfe6ee; border-color: #dfe6ee; }
  #note {
    position: fixed; right: 26px; bottom: 24px; z-index: 5; max-width: 300px; text-align: right;
    font: 500 13px/1.45 ui-monospace, "SF Mono", Menlo, monospace; color: rgba(223,230,238,.42);
  }
</style>
</head>
<body>
<three-d-stage name="umbrella" background="#0d0f12"></three-d-stage>
<div id="state">
  <button data-mode="idle" aria-pressed="true">idle</button>
  <button data-mode="listening" aria-pressed="false">listening</button>
  <button data-mode="thinking" aria-pressed="false">thinking</button>
  <button data-mode="gust" aria-pressed="false">gust</button>
  <button data-mode="talking" aria-pressed="false">talking</button>
  <button data-mode="furled" aria-pressed="false">furled</button>
</div>
<div id="note">…</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

/* cool overcast env — wet-day light */
try {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 32;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 32);
  g.addColorStop(0, '#eef4fb'); g.addColorStop(0.5, '#8f9aa8');
  g.addColorStop(0.56, '#2a2f36'); g.addColorStop(1, '#12151a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 32);
  ctx.fillStyle = 'rgba(245,250,255,0.9)';
  ctx.beginPath(); ctx.ellipse(22, 6, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
  const tex = new THREE.Texture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(stage._renderer);
  stage._scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
} catch (e) {}

const umbrella = new THREE.Group(); umbrella.name = 'umbrella_character';
const spinner = new THREE.Group(); spinner.name = 'spinner';   /* twirls about the shaft */
const body = new THREE.Group(); body.name = 'body';            /* tilt + squash */
umbrella.add(spinner); spinner.add(body);

/* ---------- canopy: 8 panels of fabric sagging between ribs ---------- */
const PANELS = 8, PSEG = 14, RINGS = 16, R = 1.35, TOP = 0.95;
const AROUND = PANELS * PSEG;
const canopyGeo = new THREE.BufferGeometry();
{
  const verts = (AROUND + 1) * (RINGS + 1);
  canopyGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts * 3), 3));
  const colors = new Float32Array(verts * 3);
  const fab = new THREE.Color('#2c3a63'), seam = new THREE.Color('#121а28'.replace('а','a')), lift = new THREE.Color('#6f83b8');
  const tc = new THREE.Color();
  let k = 0;
  for (let i = 0; i <= AROUND; i++) {
    const pt = (i % PSEG) / PSEG;                 /* position within the panel */
    const seamNess = Math.pow(1 - Math.sin(pt * Math.PI), 3);
    for (let j = 0; j <= RINGS; j++) {
      const u = j / RINGS;
      tc.copy(fab).lerp(seam, seamNess * 0.9).lerp(lift, Math.sin(pt * Math.PI) * (1 - u * 0.55) * 0.5);
      colors[k++] = tc.r; colors[k++] = tc.g; colors[k++] = tc.b;
    }
  }
  canopyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const idx = [];
  const at = (i, j) => i * (RINGS + 1) + j;
  for (let i = 0; i < AROUND; i++) for (let j = 0; j < RINGS; j++) {
    idx.push(at(i, j), at(i, j + 1), at(i + 1, j + 1), at(i, j), at(i + 1, j + 1), at(i + 1, j));
  }
  canopyGeo.setIndex(idx);
}

const tips = [];   /* rib-tip nubs, positioned from the hem each reshape */

/* openness 0 = furled tight, 1 = wide open; invert 0..1 = blown inside-out */
let lastShape = null;
const shapeCanopy = (open, invert, flutter, tPhase) => {
  const key = `${open.toFixed(3)}|${invert.toFixed(3)}|${flutter.toFixed(3)}|${(tPhase % 1000).toFixed(2)}`;
  if (key === lastShape) return;
  lastShape = key;
  const p = canopyGeo.attributes.position.array;
  let k = 0;
  for (let i = 0; i <= AROUND; i++) {
    const a = (i / AROUND) * Math.PI * 2;
    const pt = (i % PSEG) / PSEG;
    const sag = Math.sin(pt * Math.PI);            /* 0 at a rib, 1 mid-panel */
    const wave = Math.sin(tPhase * 2.4 + a * 3) * flutter;
    for (let j = 0; j <= RINGS; j++) {
      const u = j / RINGS;
      /* open: dome that curves down and flares back up at the hem */
      let rO = R * Math.pow(u, 0.88) * (1 - 0.07 * sag * u * u);
      let yO = TOP - 1.12 * Math.pow(u, 1.72) + 0.08 * Math.pow(u, 6);
      yO += sag * (0.1 * Math.pow(u, 2.4) - 0.018 * u);   /* gentle bulge between ribs */
      /* inside-out: hem whips up past the crown */
      const yI = TOP - 0.26 * u + 1.1 * Math.pow(u, 1.9) + sag * 0.11 * Math.pow(u, 1.4);
      const rI = R * Math.pow(u, 0.8) * 0.92;
      /* furled: fabric gathers into a thin column down the shaft */
      const rC = R * 0.07 * (0.35 + u * 0.9) * (1 - 0.35 * sag);
      const yC = TOP - 1.9 * u;

      let r = rO + (rI - rO) * invert;
      let y = yO + (yI - yO) * invert;
      r = rC + (r - rC) * open;
      y = yC + (y - yC) * open;
      y += wave * u * u * 0.045;
      r += wave * u * 0.02;

      p[k++] = Math.cos(a) * r;
      p[k++] = y;
      p[k++] = Math.sin(a) * r;
    }
  }
  canopyGeo.attributes.position.needsUpdate = true;
  canopyGeo.computeVertexNormals();
  const stride = (RINGS + 1) * 3;
  for (let n = 0; n < tips.length; n++) {
    const base = n * PSEG * stride + RINGS * 3;
    tips[n].position.set(p[base], p[base + 1], p[base + 2]);
  }
};
shapeCanopy(1, 0, 0, 0);

const canopyMat = new THREE.MeshPhysicalMaterial({
  name: 'canopy_fabric',
  vertexColors: true,
  side: THREE.DoubleSide,
  roughness: 0.68,
  metalness: 0,
  sheen: 1,
  sheenRoughness: 0.55,
  sheenColor: new THREE.Color('#93a6d6'),
  clearcoat: 0.25,
  clearcoatRoughness: 0.7,
});
const canopy = new THREE.Mesh(canopyGeo, canopyMat);
canopy.name = 'canopy';
body.add(canopy);

const tipMat = new THREE.MeshStandardMaterial({
  name: 'rib_tip', color: new THREE.Color('#8d96a3'), roughness: 0.45, metalness: 0.6,
});
for (let i = 0; i < PANELS; i++) {
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.025, 10, 8), tipMat);
  tip.name = 'rib_tip_' + i;
  tips.push(tip);
  body.add(tip);
}

/* ---------- shaft, ferrule, crook handle ---------- */
const metalMat = new THREE.MeshStandardMaterial({
  name: 'metal', color: new THREE.Color('#b9c1cb'), roughness: 0.32, metalness: 0.9,
});
const woodMat = new THREE.MeshStandardMaterial({
  name: 'handle_wood', color: new THREE.Color('#5d3620'), roughness: 0.48, metalness: 0.05,
});

const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.85, 20), metalMat);
shaft.name = 'shaft';
shaft.position.y = -0.475;   /* spans y = 0.95 → -1.9 */
body.add(shaft);

const ferrule = new THREE.Mesh(new THREE.ConeGeometry(0.058, 0.24, 16), metalMat);
ferrule.name = 'ferrule';
ferrule.position.y = TOP + 0.13;
body.add(ferrule);

const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.12, 16), metalMat);
collar.name = 'runner_collar';
collar.position.y = -0.34;
body.add(collar);

const crook = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.05, 14, 40, Math.PI), woodMat);
crook.name = 'handle_crook';
crook.position.set(-0.22, -1.9, 0);   /* shaft ends at y = -1.9; hook curls out to the left */
crook.rotation.z = Math.PI;             /* lower half of the ring = a U that hooks back up */
body.add(crook);

/* ---------- moods ---------- */
const MOODS = {
  idle:      { open: 1,    invert: 0, twirl: 0,   jitter: 0.05, lean: 0.0,  sway: 0.055, swaySpeed: 0.9, flutter: 0.12 },
  listening: { open: 1,    invert: 0, twirl: 0,   jitter: 0.02, lean: -0.2, sway: 0.10,  swaySpeed: 1.5, flutter: 0.06 },
  thinking:  { open: 1,    invert: 0, twirl: 4.2, jitter: 0.06, lean: 0.06, sway: 0.02,  swaySpeed: 1.0, flutter: 0.5 },
  gust:      { open: 1,    invert: 1, twirl: 1.4, jitter: 0.75, lean: 0.22, sway: 0.09,  swaySpeed: 2.6, flutter: 1.5 },
  talking:   { open: 1,    invert: 0, twirl: 0,   jitter: 0.14, lean: 0.05, sway: 0.045, swaySpeed: 1.4, flutter: 0.3 },
  furled:    { open: 0,    invert: 0, twirl: 0,   jitter: 0.03, lean: 0.02, sway: 0.03,  swaySpeed: 0.7, flutter: 0.02 },
};
const LINES = {
  idle: '…',
  listening: 'go on.',
  thinking: 'hm. working on it.',
  gust: 'agh — inside out!',
  talking: 'here you go.',
  furled: 'packing up.',
};
let target = MOODS.idle, m = { ...MOODS.idle };
const note = document.getElementById('note');
document.querySelectorAll('#state button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#state button').forEach(b =>
      b.setAttribute('aria-pressed', String(b === btn)));
    target = MOODS[btn.dataset.mode];
    note.textContent = LINES[btn.dataset.mode];
    if (target === MOODS.gust) { tz.v += 9; sq.v -= 3; }
  });
});

/* ---------- springy rig ---------- */
const clock = new THREE.Clock();
let t = 0;
const sq = { p: 0, v: 0 }, tz = { p: 0, v: 0 }, tx = { p: 0, v: 0 };
const spring = (s, k, c, dt, to = 0) => {
  s.v += (to - s.p) * k * dt - s.v * c * dt;
  s.p += s.v * dt;
};

let y = 0, twirlA = 0, twirlV = 0;
let openP = 1, openV = 0, invertP = 0;
let evtT = 2.6, sylT = 0, gustT = 0;

canopy.onBeforeRender = () => {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  for (const k in m) m[k] += (target[k] - m[k]) * Math.min(1, dt * 3.2);

  /* twirl about the shaft — spins up and coasts down */
  twirlV += (m.twirl - twirlV) * Math.min(1, dt * 2.2);
  twirlA += twirlV * dt;

  /* gusts snap it inside-out, then it flops back with a shudder */
  const gusting = target === MOODS.gust;
  if (gusting) {
    gustT -= dt;
    if (gustT <= 0) {
      invertP = 1;
      sq.v -= 4;
      tz.v += (Math.random() - 0.5) * 12;
      gustT = 1.6 + Math.random() * 1.4;
    }
  }
  invertP = Math.max(0, invertP - dt * (gusting ? 0.7 : 3.2));

  /* open/close springs so the canopy pops and overshoots */
  openV += (m.open - openP) * 110 * dt - openV * 9 * dt;
  openP += openV * dt;

  /* idle fidgets: a shrug, a half-furl, a shake of the water off */
  if (!gusting) {
    evtT -= dt;
    if (evtT <= 0) {
      const r = Math.random();
      if (r < 0.4) sq.v += 1.6;
      else if (r < 0.7) { openV -= 3.5; }               /* quick half-collapse and pop */
      else { tz.v += (Math.random() - 0.5) * 5; tx.v += 1.2; }
      evtT = 3 + Math.random() * 4.5;
    }
  }

  if (target === MOODS.talking) {
    sylT -= dt;
    if (sylT <= 0) {
      sq.v += 1.1 + Math.random();
      openV += 0.9;
      tz.v += (Math.random() - 0.5) * 1.6;
      sylT = 0.13 + Math.random() * 0.16;
    }
  }

  spring(sq, 150, 10, dt);
  const swayAmt = Math.sin(t * m.swaySpeed * 1.8) * m.sway;
  spring(tz, 62, 6, dt, swayAmt);
  spring(tx, 62, 6, dt, m.lean * 0.22 + Math.sin(t * m.swaySpeed * 1.1) * m.sway * 0.5);

  const tremor = m.jitter * 0.015;
  const bob = Math.sin(t * 1.2) * 0.022;

  shapeCanopy(
    Math.max(0, Math.min(1.15, openP)),
    Math.min(1, invertP),
    m.flutter * (0.6 + Math.abs(twirlV) * 0.12),
    t);

  umbrella.position.set(
    (Math.random() - 0.5) * tremor,
    y + bob + Math.abs(swayAmt) * 0.25 + sq.p * 0.03,
    (Math.random() - 0.5) * tremor);
  umbrella.rotation.set(
    tx.p + (Math.random() - 0.5) * tremor,
    0,
    tz.p + (Math.random() - 0.5) * tremor * 1.3);

  spinner.rotation.y = twirlA;
  const s = sq.p * 0.06;
  body.scale.set(1 - s * 0.5, 1 + s, 1 - s * 0.5);
};

stage.setObject(umbrella);
/* dolly toward the frame target (scaling the raw position moves it off-axis) */
{
  const tgt = stage._controls.target;
  stage._camera.position.sub(tgt).multiplyScalar(0.52).add(tgt);
  stage._camera.updateProjectionMatrix();
  stage._controls.update();
}
stage._ground.visible = false;
stage._key.castShadow = false;
umbrella.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
</script>
</body>
</html>
